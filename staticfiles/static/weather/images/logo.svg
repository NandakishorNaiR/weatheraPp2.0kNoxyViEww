<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1528"/>
      <stop offset="50%" stop-color="#0f2246"/>
      <stop offset="100%" stop-color="#080e1a"/>
    </linearGradient>

    <!-- Sun Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Sun Gradient -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Cloud Gradient -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cfd8dc"/>
    </linearGradient>

    <!-- Cloud Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Circle (Squircle/Rounded Rect for Modern App Icon) -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="4"/>

  <!-- Glowing Sun -->
  <circle cx="300" cy="212" r="76" fill="url(#sunGrad)" filter="url(#glow)"/>

  <!-- Sun Rays (subtle details) -->
  <g stroke="url(#sunGrad)" stroke-width="8" stroke-linecap="round" opacity="0.8">
    <line x1="300" y1="96" x2="300" y2="116" />
    <line x1="300" y1="308" x2="300" y2="328" />
    <line x1="184" y1="212" x2="204" y2="212" />
    <line x1="396" y1="212" x2="416" y2="212" />
    <line x1="218" y1="130" x2="232" y2="144" />
    <line x1="368" y1="280" x2="382" y2="294" />
    <line x1="382" y1="130" x2="368" y2="144" />
    <line x1="232" y1="280" x2="218" y2="294" />
  </g>

  <!-- Cloud Body -->
  <path d="M190 380
           a64 64 0 0 1 0 -128
           a76 76 0 0 1 144 -30
           a64 64 0 0 1 106 60
           a48 48 0 0 1 -20 94
           z" 
        fill="url(#cloudGrad)" 
        filter="url(#shadow)"/>
</svg>
